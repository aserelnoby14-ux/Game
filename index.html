<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XO ONLINE</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
    margin:0;
    padding:20px;
}

h1{
    font-size:42px;
}

#status{
    margin:20px;
    font-size:28px;
}

.board{
    display:grid;
    grid-template-columns:repeat(3,120px);
    gap:15px;
    justify-content:center;
    margin-top:30px;
}

.cell{
    width:120px;
    height:120px;
    border:none;
    border-radius:20px;
    font-size:50px;
    background:#1e293b;
    color:white;
    cursor:pointer;
    transition:0.2s;
}

.cell:hover{
    transform:scale(1.05);
    background:#334155;
}

#result{
    margin-top:30px;
    font-size:30px;
}

#restart{
    margin-top:20px;
    padding:15px 35px;
    border:none;
    border-radius:15px;
    background:#22c55e;
    color:white;
    font-size:24px;
    cursor:pointer;
}

#players{
    margin-top:15px;
    font-size:20px;
}

</style>

</head>

<body>

<h1>🌐 XO ONLINE</h1>

<div id="players">
👤 Player X VS 👤 Player O
</div>

<div id="status">
🎮 Player X Turn
</div>

<div class="board" id="board"></div>

<div id="result"></div>

<button id="restart" onclick="restartGame()">
🔁 إعادة اللعب
</button>

<audio id="clickSound">
<source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" type="audio/mpeg">
</audio>

<audio id="winSound">
<source src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3" type="audio/mpeg">
</audio>

<script>

let board = ["","","","","","","","",""]

let current = "X"

let rounds = 0

let scoreX = 0
let scoreO = 0

const boardDiv = document.getElementById("board")

const statusDiv = document.getElementById("status")

const resultDiv = document.getElementById("result")

const clickSound = document.getElementById("clickSound")

const winSound = document.getElementById("winSound")

function drawBoard(){

    boardDiv.innerHTML = ""

    for(let i=0;i<9;i++){

        let btn = document.createElement("button")

        btn.className = "cell"

        btn.innerText = board[i]

        btn.onclick = () => move(i)

        boardDiv.appendChild(btn)
    }
}

function move(i){

    if(board[i] != ""){
        return
    }

    clickSound.play()

    board[i] = current

    drawBoard()

    let winner = checkWinner()

    if(winner){

        winSound.play()

        if(winner == "X"){
            scoreX++
        }else{
            scoreO++
        }

        rounds++

        // انتهى الماتش
        if(rounds >= 3){

            let finalWinner =
                scoreX > scoreO
                ? "🏆 Player X Wins"
                : "🏆 Player O Wins"

            resultDiv.innerHTML = `
            ${finalWinner}

            <br><br>

            👤 X : ${scoreX}
            <br>
            👤 O : ${scoreO}
            `

            return
        }

        resultDiv.innerHTML = `
        🎮 الجولة خلصت

        <br><br>

        👤 X : ${scoreX}
        <br>
        👤 O : ${scoreO}

        <br><br>

        🔄 بدأت الجولة الجديدة
        `

        board = ["","","","","","","","",""]

        drawBoard()

        return
    }

    current = current == "X" ? "O" : "X"

    statusDiv.innerHTML = `
    🎮 Player ${current} Turn
    `
}

function checkWinner(){

    const wins = [
        [0,1,2],
        [3,4,5],
        [6,7,8],
        [0,3,6],
        [1,4,7],
        [2,5,8],
        [0,4,8],
        [2,4,6]
    ]

    for(let w of wins){

        let a = w[0]
        let b = w[1]
        let c = w[2]

        if(
            board[a] &&
            board[a] == board[b] &&
            board[a] == board[c]
        ){
            return board[a]
        }
    }

    return null
}

function restartGame(){

    board = ["","","","","","","","",""]

    current = "X"

    rounds = 0

    scoreX = 0
    scoreO = 0

    resultDiv.innerHTML = ""

    drawBoard()

    statusDiv.innerHTML = `
    🎮 Player X Turn
    `
}

drawBoard()

</script>

</body>
</html>
