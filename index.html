<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #111;
            color: white;
            padding: 30px;
        }

        button {
            padding: 15px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .green { background: #22c55e; }
        .red { background: #ef4444; }
        .blue { background: #3b82f6; }
    </style>
</head>
<body>

<h2>اختار زرار</h2>

<button class="green" onclick="send('green')">🟢 أخضر</button>
<button class="red" onclick="send('red')">🔴 أحمر</button>
<button class="blue" onclick="send('blue')">🔵 أزرق</button>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

function send(data) {
    tg.sendData(data);
}
</script>

</body>
</html>
