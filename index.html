<!-- admin.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والاستقبال السرية</title>
    <!-- استخدام Tailwind CSS لتصميم لوحة تحكم عصرية -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-emerald-400 border-b border-slate-800 pb-4">لوحة التحكم والاستقبال المركزية</h1>
        
        <div class="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-slate-800 text-slate-300 text-sm">
                            <th class="p-4">الرقم الدولي</th>
                            <th class="p-4">رمز الدولة</th>
                            <th class="p-4">نوع الخط</th>
                            <th class="p-4">وقت الاستعلام</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody" class="divide-y divide-slate-800 text-sm">
                        <!-- يتم حقن البيانات هنا تلقائياً -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function loadLogs() {
            const tbody = document.getElementById('logsTableBody');
            const storedLogs = JSON.parse(localStorage.getItem("global_logs") || "[]");

            if (storedLogs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-500">لا توجد بيانات مسجلة حتى الآن.</td></tr>`;
                return;
            }

            tbody.innerHTML = storedLogs.map(log => `
                <tr class="hover:bg-slate-850 transition">
                    <td class="p-4 font-mono text-emerald-300">${log.internationalNumber}</td>
                    <td class="p-4">${log.countryCode} (+${log.countryCallingCode})</td>
                    <td class="p-4">${log.type}</td>
                    <td class="p-4 text-slate-400 text-xs">${new Date(log.timestamp).toLocaleString()}</td>
                </tr>
            `).join('');
        }

        // تحديث البيانات تلقائياً كل ثانيتين لمتابعة العمليات الواردة
        setInterval(loadLogs, 2000);
        window.onload = loadLogs;
    </script>
</body>
  </html>
