<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>XO Online</title>
<style>
body { background:#111; color:white; text-align:center; font-family:Arial; }
button { width:80px; height:80px; font-size:30px; margin:5px; }
</style>
</head>
<body>

<h2>XO Online</h2>

<div id="board"></div>

<script>
let board = Array(9).fill(" ")

function draw(){
    let html=""
    for(let i=0;i<9;i++){
        html += `<button onclick="move(${i})">${board[i]||"⬜"}</button>`
        if((i+1)%3==0) html+="<br>"
    }
    document.getElementById("board").innerHTML = html
}

function move(i){
    if(board[i]==" "){
        board[i]="X"
        draw()
    }
}

draw()
</script>

</body>
</html>
